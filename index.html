<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<!-- version 2026-09-14a -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>ラベル用リスト作成</title>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"
        onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';document.head.appendChild(s);"></script>
<script src="https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@0.11.0/dist/index.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #f4f4f4; font-family: -apple-system, "Hiragino Sans", sans-serif; color: #222; }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
  @supports not (height: 100dvh) { body { height: -webkit-fill-available; } }

  header { background: #2b5797; color: #fff; padding: 5px 12px; font-size: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
  header small { font-size: 11px; font-weight: normal; opacity: .85; }
  #btnRefresh { font-size: 13px; padding: 5px 9px; border: 1px solid rgba(255,255,255,.6); background: rgba(255,255,255,.15); color: #fff; border-radius: 6px; }

  #camWrap { position: relative; background: #000; height: 22vh; min-height: 130px; flex: none; }
  #video { width: 100%; height: 100%; object-fit: cover; }
  #guide { position: absolute; left: 5%; right: 5%; top: 30%; height: 40%; border: 3px solid rgba(255,255,255,.8); border-radius: 8px; pointer-events: none; }
  #camMsg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; text-align: center; padding: 16px; background: rgba(0,0,0,.6); }
  #camMsg.hide { display: none; }
  #camMsg button { font-size: 19px; font-weight: bold; padding: 12px 24px; border: none; border-radius: 14px; background: #2b5797; color: #fff; }
  #statusBar { flex: none; background: #333; color: #fff; display: flex; align-items: center; gap: 8px; padding: 3px 12px; }
  #camStatus { flex: 1; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #btnStop { display: none; font-size: 13px; padding: 5px 10px; border: none; border-radius: 8px; background: #c0392b; color: #fff; }
  #btnStop.show { display: block; }

  #result { flex: none; padding: 6px 12px; background: #fff; border-bottom: 1px solid #ddd; min-height: 54px; }
  #result .name { font-size: 17px; font-weight: bold; line-height: 1.25; word-break: break-all; }
  #result .sub { font-size: 14px; margin-top: 2px; color: #444; }
  #result .price { font-size: 19px; font-weight: bold; color: #c0392b; margin-right: 10px; }
  #result.notfound .name { color: #c0392b; }

  #manual { display: flex; gap: 6px; padding: 5px 12px; background: #fff; border-bottom: 1px solid #ddd; flex: none; }
  #manual input { flex: 1; font-size: 16px; padding: 6px 8px; border: 1px solid #bbb; border-radius: 6px; }
  #manual button { font-size: 15px; padding: 0 14px; border: none; border-radius: 8px; background: #555; color: #fff; }

  #list { flex: 1; overflow-y: auto; padding: 6px 10px; }
  .row { display: flex; align-items: center; background: #fff; border-radius: 8px; padding: 6px 8px; margin-bottom: 5px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .row .no { width: 26px; font-size: 14px; color: #888; }
  .row .body { flex: 1; min-width: 0; }
  .row .n { font-size: 15px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .s { font-size: 12px; color: #666; }
  .row .del { font-size: 18px; min-width: 46px; height: 44px; margin-left: 8px; border: 2px solid #e0a0a0; background: #fdeaea; border-radius: 10px; color: #c0392b; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
  .row .del small { font-size: 10px; margin-top: 2px; }

  footer { flex: none; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid #ddd; display: flex; gap: 8px; }
  #btnClear { flex: 1; font-size: 15px; border: 1px solid #999; background: #fff; border-radius: 10px; padding: 12px 0; color: #333; }
  #btnExcel { flex: 3; font-size: 19px; font-weight: bold; border: none; background: #2b5797; color: #fff; border-radius: 10px; padding: 12px 0; }
  #btnExcel:disabled { background: #aac; }

  #toast { position: fixed; left: 50%; top: 40%; transform: translateX(-50%); background: rgba(0,0,0,.85); color: #fff; padding: 16px 28px; font-size: 22px; border-radius: 12px; display: none; z-index: 10; }
</style>
</head>
<body>

<header>
  <span>ラベル用リスト作成</span>
  <span style="display:flex;align-items:center;gap:8px">
    <small id="hdrInfo"></small>
    <button id="btnRefresh" title="マスタ更新">🔄 更新</button>
  </span>
</header>

<div id="camWrap">
  <video id="video" playsinline muted autoplay></video>
  <div id="guide"></div>
  <div id="camMsg"><button id="btnCam">📷 カメラを開始</button></div>
</div>
<div id="statusBar"><div id="camStatus">状態：カメラ待機中（ボタンを押してください）</div><button id="btnStop">■ カメラ終了</button></div>

<div id="result">
  <div class="name" id="rName">バーコードをかざしてください</div>
  <div class="sub" id="rSub"></div>
</div>

<div id="manual">
  <input id="janInput" type="tel" inputmode="numeric" placeholder="読めない時はJANを手入力">
  <button id="btnManual">検索</button>
</div>

<div id="list"></div>

<footer>
  <button id="btnClear">全部消す</button>
  <button id="btnExcel" disabled>Excel作成（0件）</button>
</footer>

<div id="toast"></div>

<script>
// ===== 設定 =====
const API_URL = 'https://script.google.com/macros/s/AKfycbyAUOzi4Iy6ofteZP3B2NXTo7qQ8Bu1iln0jrNdBUsKtvx8myW82yAamkAXTnYBvMgwZQ/exec';
// ================

const items = [];              // {jan, name, price, supplier}
let lastCode = '', lastSeen = 0, busy = false;

const $ = id => document.getElementById(id);

// ---- 効果音 ----
let audioCtx = null;
function beep(ok) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = ok ? 1200 : 300; o.type = 'square';
    g.gain.value = 0.15; o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + (ok ? 0.12 : 0.4));
  } catch (e) {}
}

function toast(msg, ms) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._tm); t._tm = setTimeout(() => t.style.display = 'none', ms || 1500);
}

function normalizeJan(s) {
  s = String(s || '').replace(/\D/g, '');
  if (!s) return '';
  return s.length < 13 ? s.padStart(13, '0') : s;
}

function yen(n) { return n === '' || n == null ? '' : '¥' + Number(n).toLocaleString('ja-JP'); }

// ---- 検索 ----
async function lookup(jan) {
  if (busy) return;
  busy = true;
  showResult({ name: '検索中…', sub: jan });
  try {
    let d;
    if (master) {
      const r = master.get(jan);
      d = r ? { ok: true, found: true, jan: jan, name: r[0], price: r[1], supplier: r[2] } : { ok: true, found: false, jan: jan };
    } else {
      const res = await fetch(API_URL + '?jan=' + encodeURIComponent(jan) + '&_=' + Date.now());
      d = await res.json();
    }
    if (!d.ok) throw new Error(d.error || 'エラー');
    if (!d.found) {
      beep(false);
      showResult({ name: 'マスタにありません', sub: 'JAN ' + d.jan, notfound: true });
    } else {
      beep(true);
      items.push({ jan: d.jan, name: d.name, price: d.price, supplier: d.supplier });
      showResult({ name: d.name, price: d.price, supplier: d.supplier, jan: d.jan });
      renderList();
      if (scanning) stopCamera('次の商品を読む');   // 読めたらカメラを止める
    }
  } catch (e) {
    beep(false);
    showResult({ name: '通信エラー', sub: String(e.message || e), notfound: true });
  } finally {
    busy = false;
  }
}

function showResult(r) {
  const box = $('result');
  box.classList.toggle('notfound', !!r.notfound);
  $('rName').textContent = r.name;
  if (r.price !== undefined) {
    $('rSub').innerHTML = '<span class="price">' + yen(r.price) + '</span> 仕入先 ' + escapeHtml(r.supplier) + '　JAN ' + r.jan;
  } else {
    $('rSub').textContent = r.sub || '';
  }
}

function renderList() {
  const list = $('list');
  list.innerHTML = items.map((it, i) =>
    '<div class="row"><div class="no">' + (i + 1) + '</div>' +
    '<div class="body"><div class="n">' + escapeHtml(it.name) + '</div>' +
    '<div class="s">' + yen(it.price) + '　仕入先 ' + escapeHtml(it.supplier) + '　' + it.jan + '</div></div>' +
    '<button class="del" data-i="' + i + '">🗑<small>削除</small></button></div>'
  ).join('');
  list.scrollTop = list.scrollHeight;
  $('btnExcel').disabled = items.length === 0;
  $('btnExcel').textContent = 'Excel作成（' + items.length + '件）';
}

$('list').addEventListener('click', e => {
  const b = e.target.closest('.del');
  if (!b) return;
  items.splice(Number(b.dataset.i), 1);
  renderList();
});

$('btnClear').addEventListener('click', () => {
  if (!items.length) return;
  if (confirm('リストを全部消しますか？')) { items.length = 0; renderList(); showResult({ name: 'バーコードをかざしてください' }); }
});

$('btnManual').addEventListener('click', () => {
  const j = normalizeJan($('janInput').value);
  if (!j) return;
  $('janInput').value = ''; $('janInput').blur();
  lookup(j);
});
$('janInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnManual').click(); });

// ---- Excel作成 ----
$('btnExcel').addEventListener('click', () => {
  if (!items.length) return;
  // 取込用フォーマット: JAN / 商品名 / 仕入先コード / 金額
  const aoa = [['JAN', '商品名', '仕入先コード', '金額']];
  items.forEach(it => aoa.push([it.jan, it.name, it.supplier, it.price === '' ? '' : Number(it.price)]));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  for (let r = 1; r <= items.length; r++) {
    const a = ws['A' + (r + 1)], c = ws['C' + (r + 1)], d = ws['D' + (r + 1)];
    if (a) { a.t = 's'; a.z = '@'; }          // JAN は文字列（0落ち防止）
    if (c) { c.t = 's'; c.z = '@'; }          // 仕入先コードも文字列
    if (d && d.t === 'n') d.z = '#,##0';      // 金額 カンマ区切り
  }
  ws['!cols'] = [{ wch: 16 }, { wch: 32 }, { wch: 12 }, { wch: 10 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');

  const d = new Date(), p = n => String(n).padStart(2, '0');
  const fname = d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + '.xlsx';

  const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const mime = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const blob = new Blob([buf], { type: mime });
  const file = new File([blob], fname, { type: mime });

  // ホーム画面アプリでも確実に渡せるよう共有シートを使う（NIIMBOT へ直接 / ファイルに保存）
  if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: fname }).catch(() => {});
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('保存しました\n' + fname, 2500);
});

// ---- カメラ / バーコード読取 ----
let stream = null, scanning = false, frames = 0, lastRawText = '';

function setStatus(t) { $('camStatus').textContent = '状態：' + t; }

function camMsg(html, isError) {
  const m = $('camMsg');
  m.classList.remove('hide');
  m.innerHTML = '<div style="font-size:' + (isError ? '17' : '20') + 'px;white-space:pre-line">' + html + '</div>' +
    '<br><button id="btnCam">📷 もう一度</button>';
  $('btnCam').addEventListener('click', startCamera);
}

let camStartedAt = 0, sameHintShown = false;
function onCode(text) {
  lastRawText = text;
  const code = normalizeJan(text);
  if (!code) return;
  const now = Date.now();
  // 前回と同じコードは、(1)再開直後 (2)かざし続けている間 は無視。
  // 一度カメラから外して1.5秒以上たってから再度かざすと、改めて追加できる。
  if (code === lastCode && (now - camStartedAt < 3000 || now - lastSeen < 1500)) {
    lastSeen = now;
    if (!sameHintShown) { sameHintShown = true; toast('同じ商品です。もう1枚必要なら一度離してからかざしてください', 2500); }
    return;
  }
  lastCode = code; lastSeen = now;
  lookup(code);
}

let engine = '';
let zxReader = null;
const cropCanvas = document.createElement('canvas');
const cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });

/** 映像の中央帯（横90%×縦40%）を切り出して解析。ZBar優先、だめならZXing */
function startScanLoop(video) {
  const useZbar = typeof zbarWasm !== 'undefined';
  engine = useZbar ? 'ZBar' : 'ZXing';
  if (!useZbar && typeof ZXing !== 'undefined' && !zxReader) {
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.ITF
    ]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    zxReader = new ZXing.BrowserMultiFormatReader(hints);
  }

  const step = async () => {
    if (!scanning) return;
    try {
      if (video.readyState >= 2 && video.videoWidth) {
        const vw = video.videoWidth, vh = video.videoHeight;
        const sx = Math.round(vw * 0.05), sw = Math.round(vw * 0.90);
        const sy = Math.round(vh * 0.30), sh = Math.round(vh * 0.40);
        if (cropCanvas.width !== sw || cropCanvas.height !== sh) { cropCanvas.width = sw; cropCanvas.height = sh; }
        cropCtx.drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);
        frames++;
        if (useZbar) {
          const img = cropCtx.getImageData(0, 0, sw, sh);
          const syms = await zbarWasm.scanImageData(img);
          if (syms && syms.length) {
            const t = syms[0].decode();
            if (t) onCode(t);
          }
        } else if (zxReader) {
          try {
            const r = zxReader.decodeFromCanvas(cropCanvas);
            if (r) onCode(r.getText());
          } catch (e) { /* NotFound は無視 */ }
        }
      }
    } catch (e) {
      setStatus('読み取りエラー: ' + (e.message || e));
    }
    setTimeout(step, 120);
  };
  step();
}

function stopCamera(nextLabel) {
  scanning = false;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  const v = $('video'); v.srcObject = null;
  $('btnStop').classList.remove('show');
  setStatus('カメラ停止中');
  const m = $('camMsg');
  m.classList.remove('hide');
  m.innerHTML = '<button id="btnCam">📷 ' + (nextLabel || 'カメラを開始') + '</button>';
  $('btnCam').addEventListener('click', startCamera);
}
$('btnStop').addEventListener('click', () => stopCamera('カメラを開始'));

async function startCamera() {
  const video = $('video');
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('このブラウザはカメラに対応していません。Safariで開いてください。');
    }
    if (typeof zbarWasm === 'undefined' && typeof ZXing === 'undefined') {
      throw new Error('読み取りライブラリを読み込めませんでした。電波状況を確認して再読み込みしてください。');
    }
    setStatus('カメラ起動中…');
    $('camMsg').innerHTML = '<div style="font-size:20px">カメラを起動しています…</div>';

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    video.setAttribute('playsinline', 'true');
    video.muted = true;
    await video.play();
    $('camMsg').classList.add('hide');
    setStatus('カメラ起動OK → 読み取り開始中…');

    scanning = true;
    frames = 0;
    lastRawText = ''; camStartedAt = Date.now(); lastSeen = Date.now(); sameHintShown = false;
    $('btnStop').classList.add('show');
    startScanLoop(video);

    // 生存表示：数字が増え続けていれば読み取り処理は動いている
    const tick = () => {
      if (!scanning) return;
      setStatus('読み取り中(' + engine + ') ' + frames + (lastRawText ? '　最後に読んだ: ' + lastRawText : ''));
      setTimeout(tick, 1000);
    };
    tick();
  } catch (e) {
    scanning = false;
    const name = e && e.name ? e.name : '';
    let msg = 'カメラを起動できませんでした。\n';
    if (name === 'NotAllowedError') msg += 'カメラの使用が許可されていません。\n設定 → Safari → カメラ を「許可」にしてください。';
    else if (name === 'NotFoundError') msg += 'カメラが見つかりません。';
    else if (name === 'NotReadableError') msg += '他のアプリがカメラを使用中です。';
    else msg += String(e.message || e);
    setStatus('エラー');
    camMsg(msg, true);
  }
}

$('btnCam').addEventListener('click', startCamera);

// ---- マスタの端末内キャッシュ（IndexedDB） ----
let master = null;          // Map<jan, [name, price, supplier]>
let masterUpdated = '';

function idbOpen() {
  return new Promise((res, rej) => {
    const rq = indexedDB.open('labelapp', 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const rq = db.transaction('kv').objectStore('kv').get(key);
    rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
  });
}
async function idbSet(key, val) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(val, key);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}

function buildMap(rows) {
  const m = new Map();
  for (const r of rows) {
    const k = normalizeJan(r[0]);          // 数値化・0落ちなどの形式ゆれを吸収
    if (k) m.set(k, [r[1], r[2], r[3]]);
  }
  return m;
}

function fmtUpdated(u) {
  const d = new Date(u);
  if (isNaN(d)) return String(u).slice(0, 16);
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function setHdr(t) { $('hdrInfo').textContent = t; }

let loading = false, lastCheck = 0;
async function loadMaster(manual) {
  if (loading) return;
  loading = true;
  try { await loadMaster_(manual); } finally { loading = false; }
}
async function loadMaster_(manual) {
  // 1. 端末内のキャッシュを読む（あれば即使える）
  if (!master) {
    try {
      const c = await idbGet('master');
      if (c && c.rows && c.rows.length) {
        master = buildMap(c.rows); masterUpdated = c.updated;
        setHdr('マスタ ' + fmtUpdated(c.updated) + '（端末内）');
      }
    } catch (e) {}
  }

  // 2. サーバーの更新日時を確認し、違えば裏でダウンロード
  let m;
  try {
    if (manual) setHdr('確認中…');
    m = await (await fetch(API_URL + '?ping=1&_=' + Date.now())).json();
  } catch (e) {
    if (!master) setHdr('マスタ未取得・通信不可');
    else if (manual) { toast('通信できません。電波を確認してください', 2000); setHdr('マスタ ' + fmtUpdated(masterUpdated) + '（端末内）'); }
    return;
  }
  lastCheck = Date.now();
  if (!m.ok) return;
  if (master && m.updated === masterUpdated) {
    setHdr('マスタ ' + fmtUpdated(masterUpdated) + '（端末内）');
    if (manual) toast('マスタは最新です（' + fmtUpdated(masterUpdated) + '）', 2000);
    return;
  }

  try {
    const all = [];
    for (let i = 0; i < m.chunks; i++) {
      setHdr('マスタ取得中 ' + Math.round(i / m.chunks * 100) + '%');
      const d = await (await fetch(API_URL + '?dump=' + i + '&_=' + Date.now())).json();
      if (!d.ok) throw new Error(d.error || 'dump error');
      for (const r of d.rows) all.push(r);
    }
    await idbSet('master', { updated: m.updated, rows: all });
    master = buildMap(all); masterUpdated = m.updated;
    setHdr('マスタ ' + fmtUpdated(m.updated) + '（端末内）');
    toast('マスタを更新しました（' + all.length.toLocaleString() + '件）', 2000);
  } catch (e) {
    setHdr(master ? 'マスタ ' + fmtUpdated(masterUpdated) + '（更新失敗）' : 'マスタ取得失敗');
  }
}

function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

document.addEventListener('touchstart', () => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }, { once: true });

// 更新ボタン：マスタを確認して必要なら取り直す。長押し（1.5秒）でアプリ自体を再読み込み。
$('btnRefresh').addEventListener('click', () => loadMaster(true));
let pressTimer = null;
$('btnRefresh').addEventListener('touchstart', () => { pressTimer = setTimeout(() => { pressTimer = null; location.reload(); }, 1500); });
$('btnRefresh').addEventListener('touchend', () => { if (pressTimer) clearTimeout(pressTimer); });

// ホーム画面アプリで開きっぱなしでも、前面に戻るたび（10分以上あいたら）マスタを確認
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Date.now() - lastCheck > 10 * 60 * 1000) loadMaster(false);
});
loadMaster(false);
</script>
</body>
