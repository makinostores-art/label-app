<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<!-- version 2026-09-12c -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ラベル用リスト作成</title>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"
        onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';document.head.appendChild(s);"></script>
<script src="https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@0.11.0/dist/index.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #f4f4f4; font-family: -apple-system, "Hiragino Sans", sans-serif; color: #222; }
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  header { background: #2b5797; color: #fff; padding: 12px 16px; font-size: 22px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
  header small { font-size: 14px; font-weight: normal; opacity: .85; }

  #camWrap { position: relative; background: #000; height: 34vh; flex: none; }
  #video { width: 100%; height: 100%; object-fit: cover; }
  #guide { position: absolute; left: 5%; right: 5%; top: 30%; height: 40%; border: 3px solid rgba(255,255,255,.8); border-radius: 8px; pointer-events: none; }
  #camMsg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; text-align: center; padding: 16px; background: rgba(0,0,0,.6); }
  #camMsg.hide { display: none; }
  #camMsg button { font-size: 26px; font-weight: bold; padding: 20px 36px; border: none; border-radius: 14px; background: #2b5797; color: #fff; }
  #camStatus { flex: none; background: #333; color: #fff; font-size: 16px; padding: 6px 16px; }

  #result { flex: none; padding: 14px 16px; background: #fff; border-bottom: 1px solid #ddd; min-height: 96px; }
  #result .name { font-size: 26px; font-weight: bold; line-height: 1.3; word-break: break-all; }
  #result .sub { font-size: 20px; margin-top: 6px; color: #444; }
  #result .price { font-size: 30px; font-weight: bold; color: #c0392b; margin-right: 16px; }
  #result.notfound .name { color: #c0392b; }

  #manual { display: flex; gap: 8px; padding: 10px 16px; background: #fff; border-bottom: 1px solid #ddd; flex: none; }
  #manual input { flex: 1; font-size: 22px; padding: 10px; border: 2px solid #bbb; border-radius: 8px; }
  #manual button { font-size: 20px; padding: 0 22px; border: none; border-radius: 8px; background: #555; color: #fff; }

  #list { flex: 1; overflow-y: auto; padding: 8px 16px; }
  .row { display: flex; align-items: center; background: #fff; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .row .no { width: 34px; font-size: 18px; color: #888; }
  .row .body { flex: 1; min-width: 0; }
  .row .n { font-size: 19px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .s { font-size: 15px; color: #666; }
  .row .del { font-size: 26px; width: 48px; height: 48px; border: none; background: #eee; border-radius: 50%; color: #c0392b; }

  footer { flex: none; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid #ddd; display: flex; gap: 12px; }
  #btnClear { flex: 1; font-size: 20px; border: 2px solid #999; background: #fff; border-radius: 12px; padding: 18px 0; color: #333; }
  #btnExcel { flex: 3; font-size: 26px; font-weight: bold; border: none; background: #2b5797; color: #fff; border-radius: 12px; padding: 18px 0; }
  #btnExcel:disabled { background: #aac; }

  #toast { position: fixed; left: 50%; top: 40%; transform: translateX(-50%); background: rgba(0,0,0,.85); color: #fff; padding: 16px 28px; font-size: 22px; border-radius: 12px; display: none; z-index: 10; }
</style>
</head>
<body>

<header>
  <span>ラベル用リスト作成</span>
  <small id="hdrInfo"></small>
</header>

<div id="camWrap">
  <video id="video" playsinline muted autoplay></video>
  <div id="guide"></div>
  <div id="camMsg"><button id="btnCam">📷 カメラを開始</button></div>
</div>
<div id="camStatus">状態：カメラ待機中（ボタンを押してください）</div>

<div id="result">
  <div class="name" id="rName">バーコードをかざしてください</div>
  <div class="sub" id="rSub"></div>
</div>

<div id="manual">
  <input id="janInput" type="tel" inputmode="numeric" placeholder="読めない時はJANを手入力">
  <button id="btnManual">検索</button>
</div>

<div id="list"></div>

<footer>
  <button id="btnClear">全部消す</button>
  <button id="btnExcel" disabled>Excel作成（0件）</button>
</footer>

<div id="toast"></div>

<script>
// ===== 設定 =====
const API_URL = 'ここにGASのウェブアプリURLを貼る';   // https://script.google.com/macros/s/xxxxx/exec
// ================

const items = [];              // {jan, name, price, supplier}
let lastCode = '', lastSeen = 0, busy = false;

const $ = id => document.getElementById(id);

// ---- 効果音 ----
let audioCtx = null;
function beep(ok) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = ok ? 1200 : 300; o.type = 'square';
    g.gain.value = 0.15; o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + (ok ? 0.12 : 0.4));
  } catch (e) {}
}

function toast(msg, ms) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._tm); t._tm = setTimeout(() => t.style.display = 'none', ms || 1500);
}

function normalizeJan(s) {
  s = String(s || '').replace(/\D/g, '');
  if (!s) return '';
  return s.length < 13 ? s.padStart(13, '0') : s;
}

function yen(n) { return n === '' || n == null ? '' : '¥' + Number(n).toLocaleString('ja-JP'); }

// ---- 検索 ----
async function lookup(jan) {
  if (busy) return;
  busy = true;
  showResult({ name: '検索中…', sub: jan });
  try {
    const res = await fetch(API_URL + '?jan=' + encodeURIComponent(jan) + '&_=' + Date.now());
    const d = await res.json();
    if (!d.ok) throw new Error(d.error || 'エラー');
    if (!d.found) {
      beep(false);
      showResult({ name: 'マスタにありません', sub: 'JAN ' + d.jan, notfound: true });
    } else {
      beep(true);
      items.push({ jan: d.jan, name: d.name, price: d.price, supplier: d.supplier });
      showResult({ name: d.name, price: d.price, supplier: d.supplier, jan: d.jan });
      renderList();
    }
  } catch (e) {
    beep(false);
    showResult({ name: '通信エラー', sub: String(e.message || e), notfound: true });
  } finally {
    busy = false;
  }
}

function showResult(r) {
  const box = $('result');
  box.classList.toggle('notfound', !!r.notfound);
  $('rName').textContent = r.name;
  if (r.price !== undefined) {
    $('rSub').innerHTML = '<span class="price">' + yen(r.price) + '</span> 仕入先 ' + escapeHtml(r.supplier) + '　JAN ' + r.jan;
  } else {
    $('rSub').textContent = r.sub || '';
  }
}

function renderList() {
  const list = $('list');
  list.innerHTML = items.map((it, i) =>
    '<div class="row"><div class="no">' + (i + 1) + '</div>' +
    '<div class="body"><div class="n">' + escapeHtml(it.name) + '</div>' +
    '<div class="s">' + yen(it.price) + '　仕入先 ' + escapeHtml(it.supplier) + '　' + it.jan + '</div></div>' +
    '<button class="del" data-i="' + i + '">×</button></div>'
  ).join('');
  list.scrollTop = list.scrollHeight;
  $('btnExcel').disabled = items.length === 0;
  $('btnExcel').textContent = 'Excel作成（' + items.length + '件）';
}

$('list').addEventListener('click', e => {
  const b = e.target.closest('.del');
  if (!b) return;
  items.splice(Number(b.dataset.i), 1);
  renderList();
});

$('btnClear').addEventListener('click', () => {
  if (!items.length) return;
  if (confirm('リストを全部消しますか？')) { items.length = 0; renderList(); showResult({ name: 'バーコードをかざしてください' }); }
});

$('btnManual').addEventListener('click', () => {
  const j = normalizeJan($('janInput').value);
  if (!j) return;
  $('janInput').value = ''; $('janInput').blur();
  lookup(j);
});
$('janInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnManual').click(); });

// ---- Excel作成 ----
$('btnExcel').addEventListener('click', () => {
  if (!items.length) return;
  // 取込用フォーマット: JAN / 商品名 / 仕入先コード / 金額
  const aoa = [['JAN', '商品名', '仕入先コード', '金額']];
  items.forEach(it => aoa.push([it.jan, it.name, it.supplier, it.price === '' ? '' : Number(it.price)]));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  for (let r = 1; r <= items.length; r++) {
    const a = ws['A' + (r + 1)], c = ws['C' + (r + 1)], d = ws['D' + (r + 1)];
    if (a) { a.t = 's'; a.z = '@'; }          // JAN は文字列（0落ち防止）
    if (c) { c.t = 's'; c.z = '@'; }          // 仕入先コードも文字列
    if (d && d.t === 'n') d.z = '#,##0';      // 金額 カンマ区切り
  }
  ws['!cols'] = [{ wch: 16 }, { wch: 32 }, { wch: 12 }, { wch: 10 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');

  const d = new Date(), p = n => String(n).padStart(2, '0');
  const fname = d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + '.xlsx';

  const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('保存しました\n' + fname, 2500);
});

// ---- カメラ / バーコード読取 ----
let stream = null, scanning = false, frames = 0, lastRawText = '';

function setStatus(t) { $('camStatus').textContent = '状態：' + t; }

function camMsg(html, isError) {
  const m = $('camMsg');
  m.classList.remove('hide');
  m.innerHTML = '<div style="font-size:' + (isError ? '17' : '20') + 'px;white-space:pre-line">' + html + '</div>' +
    '<br><button id="btnCam">📷 もう一度</button>';
  $('btnCam').addEventListener('click', startCamera);
}

function onCode(text) {
  lastRawText = text;
  const code = normalizeJan(text);
  if (!code) return;
  const now = Date.now();
  // 同じバーコードをかざし続けている間は1回だけ。離して再度かざすと再カウント。
  if (code === lastCode && now - lastSeen < 1500) { lastSeen = now; return; }
  lastCode = code; lastSeen = now;
  lookup(code);
}

let engine = '';
let zxReader = null;
const cropCanvas = document.createElement('canvas');
const cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });

/** 映像の中央帯（横90%×縦40%）を切り出して解析。ZBar優先、だめならZXing */
function startScanLoop(video) {
  const useZbar = typeof zbarWasm !== 'undefined';
  engine = useZbar ? 'ZBar' : 'ZXing';
  if (!useZbar && typeof ZXing !== 'undefined' && !zxReader) {
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.ITF
    ]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    zxReader = new ZXing.BrowserMultiFormatReader(hints);
  }

  const step = async () => {
    if (!scanning) return;
    try {
      if (video.readyState >= 2 && video.videoWidth) {
        const vw = video.videoWidth, vh = video.videoHeight;
        const sx = Math.round(vw * 0.05), sw = Math.round(vw * 0.90);
        const sy = Math.round(vh * 0.30), sh = Math.round(vh * 0.40);
        if (cropCanvas.width !== sw || cropCanvas.height !== sh) { cropCanvas.width = sw; cropCanvas.height = sh; }
        cropCtx.drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);
        frames++;
        if (useZbar) {
          const img = cropCtx.getImageData(0, 0, sw, sh);
          const syms = await zbarWasm.scanImageData(img);
          if (syms && syms.length) {
            const t = syms[0].decode();
            if (t) onCode(t);
          }
        } else if (zxReader) {
          try {
            const r = zxReader.decodeFromCanvas(cropCanvas);
            if (r) onCode(r.getText());
          } catch (e) { /* NotFound は無視 */ }
        }
      }
    } catch (e) {
      setStatus('読み取りエラー: ' + (e.message || e));
    }
    setTimeout(step, 120);
  };
  step();
}

async function startCamera() {
  const video = $('video');
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('このブラウザはカメラに対応していません。Safariで開いてください。');
    }
    if (typeof zbarWasm === 'undefined' && typeof ZXing === 'undefined') {
      throw new Error('読み取りライブラリを読み込めませんでした。電波状況を確認して再読み込みしてください。');
    }
    setStatus('カメラ起動中…');
    $('camMsg').innerHTML = '<div style="font-size:20px">カメラを起動しています…</div>';

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    video.setAttribute('playsinline', 'true');
    video.muted = true;
    await video.play();
    $('camMsg').classList.add('hide');
    setStatus('カメラ起動OK → 読み取り開始中…');

    scanning = true;
    frames = 0;
    startScanLoop(video);

    // 生存表示：数字が増え続けていれば読み取り処理は動いている
    const tick = () => {
      if (!scanning) return;
      setStatus('読み取り中(' + engine + ') ' + frames + (lastRawText ? '　最後に読んだ: ' + lastRawText : ''));
      setTimeout(tick, 1000);
    };
    tick();
  } catch (e) {
    scanning = false;
    const name = e && e.name ? e.name : '';
    let msg = 'カメラを起動できませんでした。\n';
    if (name === 'NotAllowedError') msg += 'カメラの使用が許可されていません。\n設定 → Safari → カメラ を「許可」にしてください。';
    else if (name === 'NotFoundError') msg += 'カメラが見つかりません。';
    else if (name === 'NotReadableError') msg += '他のアプリがカメラを使用中です。';
    else msg += String(e.message || e);
    setStatus('エラー');
    camMsg(msg, true);
  }
}

$('btnCam').addEventListener('click', startCamera);

async function ping() {
  try {
    const d = await (await fetch(API_URL + '?ping=1&_=' + Date.now())).json();
    if (d.ok) $('hdrInfo').textContent = 'マスタ更新 ' + String(d.updated).slice(0, 16);
  } catch (e) {}
}

function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

document.addEventListener('touchstart', () => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }, { once: true });
ping();
</script>
</body>
</html>
